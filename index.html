<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="TRALIX AI - Intelligent AI Assistant"
  >

  <title>TRALIX AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">

      <div class="brand">

        <div class="logo">
          T
        </div>

        <div>
          <h1>TRALIX</h1>
          <span>AI ASSISTANT</span>
        </div>

      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>

    </header>


    <main id="chat" class="chat">

      <section class="welcome">

        <div class="orb">
          T
        </div>

        <h2>Hello, I'm TRALIX.</h2>

        <p>
          Your intelligent AI assistant.
          Ask me anything.
        </p>

      </section>

    </main>


    <footer class="composer">

      <div class="input-container">

        <textarea
          id="messageInput"
          placeholder="Ask TRALIX anything..."
          rows="1"
        ></textarea>

        <button
          id="sendButton"
          type="button"
        >
          ➤
        </button>

      </div>

      <p class="disclaimer">
        TRALIX can make mistakes. Verify important information.
      </p>

    </footer>

  </div>

  <script src="app.js"></script>

</body>
</html>
